<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Tairlan Kairolla — CV</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    /* base tokens — "Day" / paper theme (default) — beige kept, everything else reworked */
    --bg:#F5F4EF;
    --bg-elevated:#EAE7DE;
    --bg-card-rgb:245,244,239;
    --text:#2A2620;
    --text-strong:#17130F;
    --text-muted:#726B5C;
    --border:#DCD3BF;
    --accent:#B0700C;
    --accent-bright:#D68A16;
    --accent-2:#1F6D5C;
    --accent-tint:rgba(176,112,12,.10);
    --hover-tint:rgba(23,19,15,.045);
    --danger:#B3492F;
    --on-accent:#FFFFFF;

    /* aliases (kept so existing rules below don't need touching) */
    --ink:var(--text-strong);
    --ink-2:var(--bg-elevated);
    --ink-line:var(--border);
    --paper-on-ink:var(--text);
    --muted-on-ink:var(--text-muted);
    --paper:var(--bg);
    --paper-2:var(--bg-elevated);
    --graphite:var(--text);
    --muted:var(--text-muted);
    --line:var(--border);
    --teal:var(--accent);
    --teal-bright:var(--accent-bright);
    --brass:var(--accent-2);
    --teal-dim:var(--accent-tint);
  }
  html[data-theme="dark"]{
    /* "Night" / moonlit theme */
    --bg:#0B0D10;
    --bg-elevated:#151812;
    --bg-card-rgb:21,24,18;
    --text:#D9D5C9;
    --text-strong:#FFFFFF;
    --text-muted:#8C8778;
    --border:rgba(255,250,240,.11);
    --accent:#6FA0E6;
    --accent-bright:#93BBFF;
    --accent-2:#D98F4E;
    --accent-tint:rgba(111,160,230,.16);
    --hover-tint:rgba(255,250,240,.05);
    --danger:#E2836A;
    --on-accent:#08121F;
  }
  html{transition:none;}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;}
  body{background:var(--paper);color:var(--graphite);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;-webkit-tap-highlight-color:transparent;}
  body.theme-ready, body.theme-ready .sidebar, body.theme-ready main.content section, body.theme-ready .hero,
  body.theme-ready .contact-icon, body.theme-ready .top-controls .lang-switch, body.theme-ready .theme-toggle,
  body.theme-ready .card, body.theme-ready .tag, body.theme-ready nav.side-nav a{
    transition:background-color .5s ease, color .5s ease, border-color .5s ease;
  }
  @media (prefers-reduced-motion: reduce){ body.theme-ready, body.theme-ready *{transition:none!important;} }
  a{color:var(--teal);text-decoration:none;}
  a:hover{text-decoration:underline;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--teal-bright);outline-offset:2px;}
  ::selection{background:var(--accent);color:var(--on-accent);}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }

  #loading{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.04em;}

  /* ---------- Living background: soft glow + drifting particles (no grid, no sun/moon here) ---------- */
  #bg-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--paper);}

  /* -- always-on living layer: never depends on scroll position -- */
  .bgl-orb{position:absolute;border-radius:50%;filter:blur(60px);background:radial-gradient(circle, var(--accent-tint), transparent 70%);}
  .bgl-orb-1{width:46vw;height:46vw;max-width:560px;max-height:560px;top:-8%;left:-10%;animation:orbFloat1 26s ease-in-out infinite;}
  .bgl-orb-2{width:38vw;height:38vw;max-width:480px;max-height:480px;top:38%;right:-12%;animation:orbFloat2 32s ease-in-out infinite;}
  .bgl-orb-3{width:30vw;height:30vw;max-width:380px;max-height:380px;bottom:-10%;left:22%;animation:orbFloat3 38s ease-in-out infinite;}
  @keyframes orbFloat1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(6vw,8vh) scale(1.15);}}
  @keyframes orbFloat2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-7vw,-6vh) scale(1.1);}}
  @keyframes orbFloat3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(5vw,-8vh) scale(1.08);}}

  .bgl-particles{position:absolute;inset:0;}
  /* Day: particles rise gently and sway side to side, with a soft twinkle in size/opacity */
  .bgl-particle{position:absolute;bottom:-10px;border-radius:50%;background:var(--accent-bright);opacity:0;
    animation-name:particleRiseGlobal, particleSwayGlobal;
    animation-timing-function:linear, ease-in-out;
    animation-iteration-count:infinite, infinite;
  }
  @keyframes particleRiseGlobal{0%{opacity:0;transform:translateY(0);}8%{opacity:.55;}50%{opacity:.35;}92%{opacity:.25;}100%{opacity:0;transform:translateY(-110vh);}}
  @keyframes particleSwayGlobal{0%,100%{margin-left:0;}50%{margin-left:18px;}}
  /* Night: the same particles become still stars that only twinkle in place */
  html[data-theme="dark"] .bgl-particle{
    bottom:auto;
    animation-name:starTwinkleStill;
    animation-timing-function:ease-in-out;
    animation-iteration-count:infinite;
    box-shadow:0 0 6px 1px rgba(255,255,255,.35);
  }
  @keyframes starTwinkleStill{0%,100%{opacity:.15;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}
  @media (prefers-reduced-motion: reduce){ .bgl-orb-1,.bgl-orb-2,.bgl-orb-3,.bgl-particle{animation:none!important;} }

  /* -- falling star, night only: irregular, angle-matched streaks spawned from JS (see spawnFallingStar) -- */
  .bgl-falling-star{position:absolute;border-radius:50%;background:#fff;
    box-shadow:0 0 7px 2px rgba(255,255,255,.85), 0 0 2px 1px #fff;
    pointer-events:none;
    will-change:transform,opacity;
  }
  .bgl-falling-star::before{content:"";position:absolute;top:50%;left:50%;height:1px;
    width:var(--trail-len,80px);
    background:linear-gradient(90deg, rgba(255,255,255,.95), rgba(255,255,255,.35) 35%, rgba(255,255,255,0));
    transform-origin:0 50%;
    transform:translateY(-50%) rotate(var(--trail-angle,180deg));
  }
  @media (prefers-reduced-motion: reduce){ .bgl-falling-star{display:none;} }

  /* -- per-section soft focus glow while scrolling (grid lines removed, glow only) -- */
  #bg-scene .scene{position:absolute;inset:-10% -10%;opacity:0;will-change:opacity;background-repeat:no-repeat;
    background-image:radial-gradient(640px 520px at var(--pos,30%) 30%, var(--accent-tint), transparent 62%);
    background-size:100% 100%;
    background-position:0 0;
  }
  #scene-summary{background-position:30% 24%;}
  #scene-education{background-position:72% 30%;}
  #scene-experience{background-position:38% 46%;}
  #scene-projects{background-position:24% 30%;}
  #scene-achievements{background-position:50% 34%;}
  #scene-certifications{background-position:62% 44%;}
  #scene-skills{background-position:50% 62%;}
  @media (prefers-reduced-motion: reduce){ #bg-scene .scene{transition:none;} }

  body.mode-edit #bg-scene{display:none;}

  .layout{display:block;position:relative;z-index:1;}
  .sidebar{background:transparent;color:var(--text);padding:48px 34px 28px;position:relative;overflow:hidden;border-bottom:1px solid var(--border);}
  .content{background:transparent;}
  .container-inner{max-width:760px;margin:0 auto;padding:0 30px;}

  .eyebrow-dark{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 16px;}
  h1.name{font-family:'Fraunces',serif;font-weight:600;font-size:29px;line-height:1.04;margin:0 0 8px;color:var(--text-strong);letter-spacing:-.015em;}
  .role-dark{font-family:'JetBrains Mono',monospace;font-weight:400;font-size:12.5px;color:var(--text-muted);margin:0 0 28px;letter-spacing:.01em;}

  .ng-wrap{display:none;} /* legacy small graph — superseded by the hero system diagram */

  nav.side-nav{display:flex;flex-direction:column;margin-bottom:30px;border-top:1px solid var(--border);padding-top:4px;}
  nav.side-nav a{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-muted);padding:11px 2px;letter-spacing:.02em;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;transition:color .2s ease,padding-left .2s ease;}
  nav.side-nav a::after{content:"→";opacity:0;transform:translateX(-4px);transition:opacity .2s ease,transform .2s ease;color:var(--accent);}
  nav.side-nav a:hover{color:var(--text);text-decoration:none;padding-left:8px;}
  nav.side-nav a:hover::after{opacity:1;transform:translateX(0);}
  nav.side-nav a.active{color:var(--accent);padding-left:8px;}
  nav.side-nav a.active::after{opacity:1;transform:translateX(0);}

  .side-contacts{display:flex;flex-direction:column;margin-bottom:26px;}
  .contact-card{display:flex;align-items:center;gap:12px;padding:10px 2px;border:none;border-bottom:1px solid var(--border);background:transparent;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:12px;transition:color .2s ease, padding-left .2s ease;position:relative;}
  a.contact-card{cursor:pointer;}
  .contact-card:hover{color:var(--text);text-decoration:none;padding-left:6px;}
  .contact-card:hover .contact-icon{color:var(--accent-bright);border-color:var(--accent);}
  .contact-icon{flex:0 0 auto;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:color .2s ease;}
  .contact-icon svg{width:14px;height:14px;}
  .contact-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .contact-text small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);opacity:.7;}
  .contact-text span, .contact-text b{font-size:12px;font-weight:500;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .contact-card .ext{margin-left:auto;flex:0 0 auto;opacity:.4;font-size:11px;transition:transform .2s ease, opacity .2s ease;}
  .contact-card:hover .ext{opacity:1;transform:translate(2px,-2px);}
  .copy-toast{position:absolute;right:2px;top:50%;transform:translateY(-50%);background:var(--accent);color:var(--on-accent);font-size:9.5px;padding:3px 7px;opacity:0;pointer-events:none;transition:opacity .2s ease;font-family:'JetBrains Mono',monospace;}
  .copy-toast.show{opacity:1;}

  .side-admin{border-top:1px solid var(--border);padding-top:16px;}
  .side-admin button{background:transparent;border:none;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 0;letter-spacing:.02em;text-align:left;}
  .side-admin button:hover{color:var(--accent);}

  /* ---------- Top controls: language + theme, always in reach ---------- */
  .top-controls{position:fixed;top:calc(16px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));z-index:60;display:flex;align-items:center;gap:8px;}
  .lang-switch{display:flex;gap:4px;background:rgba(var(--bg-card-rgb),.85);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid var(--border);border-radius:20px;padding:4px;}
  .lang-btn{background:transparent;border:none;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 10px;border-radius:16px;letter-spacing:.04em;}
  .lang-btn:hover{color:var(--text);}
  .lang-btn.active{background:var(--accent);color:var(--on-accent);font-weight:600;}
  .theme-toggle{width:34px;height:34px;border-radius:50%;background:rgba(var(--bg-card-rgb),.85);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);border:1px solid var(--border);color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;transition:transform .3s ease;}
  .theme-toggle:hover{transform:rotate(20deg);color:var(--accent);}
  @media(max-width:640px){ .top-controls{top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));} .lang-btn{padding:5px 8px;font-size:10px;} .theme-toggle{width:30px;height:30px;} }

  /* ---------- Hero: editorial split-grid, diagram-led ---------- */
  .hero{position:relative;overflow:hidden;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;text-align:left;padding:calc(112px + env(safe-area-inset-top)) 24px 64px;background:var(--bg);isolation:isolate;gap:56px;will-change:transform,opacity;}
  @media (min-width:960px){
    .hero{display:grid;grid-template-columns:1.24fr .76fr;align-items:center;padding:0 64px;column-gap:28px;row-gap:0;}
    .hero-diagram-wrap{margin:0 auto 0 0;}
  }

  /* hero-only sky: sun/moon + clouds live here, nowhere else on the page */
  .hero-sky{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .hero-glow{position:absolute;z-index:0;pointer-events:none;width:56vw;height:56vw;max-width:760px;max-height:760px;right:-14%;top:50%;transform:translateY(-50%);
    background:radial-gradient(circle, var(--accent-tint), transparent 70%);
    filter:blur(10px);animation:heroGlowPulse 9s ease-in-out infinite;
  }
  @keyframes heroGlowPulse{0%,100%{opacity:.75;transform:translateY(-50%) scale(1);}50%{opacity:1;transform:translateY(-50%) scale(1.08);}}
  @media (prefers-reduced-motion: reduce){ .hero-glow{animation:none;} }

  .hero-day{position:absolute;inset:0;opacity:1;transition:opacity .8s ease;}
  html[data-theme="dark"] .hero-day{opacity:0;}
  .hero-sun{position:absolute;top:8%;right:10%;width:60px;height:60px;border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #FFEFC4, #E8B23E 60%, transparent 78%);
    box-shadow:0 0 56px 16px rgba(214,138,22,.26);
    animation:sunPulseGlobal 7s ease-in-out infinite;
  }
  @keyframes sunPulseGlobal{0%,100%{box-shadow:0 0 56px 16px rgba(214,138,22,.26);}50%{box-shadow:0 0 74px 24px rgba(214,138,22,.38);}}
  .hero-cloud{position:absolute;opacity:.5;animation:cloudDriftGlobal linear infinite;}
  .hero-cloud svg{display:block;width:100%;height:100%;}
  .hero-cloud.day svg{fill:#fff;}
  .hero-cloud.day{filter:drop-shadow(0 6px 14px rgba(42,38,32,.14)) drop-shadow(0 -2px 5px rgba(255,255,255,.6));}
  .hero-cloud.day.hero-cloud-1{opacity:.94;}
  .hero-cloud.day.hero-cloud-2{opacity:.72;}
  .hero-cloud.day.hero-cloud-3{opacity:.55;}
  .hero-cloud.night svg{fill:#aab4c9;}
  .hero-cloud-1{top:12%;left:-25%;width:190px;height:60px;animation-duration:70s;}
  .hero-cloud-2{top:26%;left:-40%;width:140px;height:46px;animation-duration:95s;animation-delay:-20s;opacity:.32;}
  .hero-cloud-3{top:40%;left:-30%;width:110px;height:38px;animation-duration:110s;animation-delay:-55s;opacity:.24;}
  @keyframes cloudDriftGlobal{from{transform:translateX(0);}to{transform:translateX(160vw);}}
  @media (prefers-reduced-motion: reduce){ .hero-sun,.hero-moon,.hero-cloud{animation:none!important;} }

  .hero-night{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;}
  html[data-theme="dark"] .hero-night{opacity:1;}
  .hero-moon{position:absolute;top:9%;right:11%;width:48px;height:48px;border-radius:50%;
    background:radial-gradient(circle at 38% 35%, #F5F3EA, #CFC9B4 60%, transparent 78%);
    box-shadow:0 0 44px 12px rgba(147,187,255,.2), inset -9px -6px 0 rgba(11,13,16,.35);
    animation:moonGlowGlobal 8s ease-in-out infinite;
  }
  @keyframes moonGlowGlobal{0%,100%{box-shadow:0 0 44px 12px rgba(147,187,255,.2), inset -9px -6px 0 rgba(11,13,16,.35);}50%{box-shadow:0 0 58px 18px rgba(147,187,255,.3), inset -9px -6px 0 rgba(11,13,16,.35);}}
  @media (max-width:640px){ .hero-sun,.hero-moon{width:40px;height:40px;} }

  .hero-inner{position:relative;z-index:2;width:100%;max-width:640px;}
  .hero-line{opacity:0;transform:translateY(26px) scale(.97);filter:blur(8px);animation:heroIn 1s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes heroIn{to{opacity:1;transform:none;filter:blur(0);}}
  @media (prefers-reduced-motion: reduce){ .hero-line{opacity:1;transform:none;filter:none;animation:none;} }

  .hero-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 22px;display:inline-flex;align-items:center;gap:9px;}
  .hero-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-bright);box-shadow:0 0 8px 2px var(--accent-bright);animation:dotPulse 2s ease-in-out infinite;}
  @keyframes dotPulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .hero-name{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(38px,6.4vw,68px);line-height:.98;margin:0 0 20px;letter-spacing:-.02em;color:var(--text-strong);}
  .hero-name .hl{color:var(--accent);font-style:italic;}
  .hero-role{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-muted);margin:0 0 22px;letter-spacing:.01em;padding-left:18px;border-left:2px solid var(--accent);}
  .hero-tagline{font-size:16.5px;line-height:1.65;color:var(--text);max-width:48ch;margin:0 0 36px;}

  .hero-cta-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:44px;}
  .hero-btn{position:relative;display:inline-flex;align-items:center;gap:9px;padding:14px 24px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.03em;font-weight:500;border-radius:2px;transition:transform .2s ease, background .2s ease, color .2s ease, border-color .2s ease;}
  .hero-btn:hover{transform:translateY(-2px);text-decoration:none;}
  .hero-btn:active{transform:translateY(0);}
  .hero-btn-primary{background:var(--text-strong);color:var(--bg);border:1px solid var(--text-strong);}
  html[data-theme="dark"] .hero-btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .hero-btn-primary:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
  .hero-btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
  .hero-btn-ghost:hover{border-color:var(--accent);color:var(--accent);}

  .hero-scrollcue{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--text-muted);text-transform:uppercase;}
  .hero-scrollcue:hover{color:var(--accent);text-decoration:none;}
  .hero-scrollcue .cue-line{width:22px;height:1px;background:var(--text-muted);position:relative;overflow:hidden;}
  .hero-scrollcue .cue-line::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:var(--accent);animation:cueTravel 1.8s ease-in-out infinite;}
  @keyframes cueTravel{0%{left:-100%;}50%{left:0;}100%{left:100%;}}
  @media (prefers-reduced-motion: reduce){ .hero-scrollcue .cue-line::after{animation:none;left:0;} }

  /* -- Diagram column: architecture / dependency-graph visualization -- */
  .hero-diagram-wrap{position:relative;z-index:2;width:100%;aspect-ratio:1/1;max-width:480px;margin:0 auto;perspective:1200px;}
  .hero-diagram-wrap{transition:transform .35s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;}
  .hero-diagram-float{width:100%;height:100%;animation:diagramFloat 7s ease-in-out infinite;}
  @keyframes diagramFloat{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-14px) rotate(.6deg);}}
  .hero-diagram-wrap svg{width:100%;height:100%;overflow:visible;}
  @media (prefers-reduced-motion: reduce){ .hero-diagram-float{animation:none;} }
  .hd-edge{stroke:var(--border);stroke-width:1;fill:none;}
  .hd-edge-active{stroke:var(--accent);stroke-width:1;fill:none;opacity:.5;}
  .hd-packet{fill:var(--accent-bright);}
  .hd-node-ring{fill:var(--bg);stroke:var(--border);stroke-width:1.2;}
  .hd-node-ring.core{stroke:var(--accent);stroke-width:1.6;}
  .hd-core-glow{fill:none;stroke:var(--accent);stroke-width:1;opacity:.25;animation:coreGlowPulse 3.4s ease-in-out infinite;}
  @keyframes coreGlowPulse{0%,100%{opacity:.12;stroke-width:1;}50%{opacity:.32;stroke-width:2.5;}}
  .hd-node-dot{fill:var(--accent-bright);}
  .hd-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:var(--text-muted);letter-spacing:.02em;}
  .hd-label.core{fill:var(--text-strong);font-weight:600;}
  .hd-monogram{font-family:'Fraunces',serif;font-weight:600;font-size:22px;fill:var(--text-strong);}
  @media (prefers-reduced-motion: reduce){ .hd-core-glow{animation:none;} .hero-diagram-wrap animateMotion{display:none;} }
  @media (max-width:959px){ .hero-diagram-wrap{max-width:340px;} }

  /* ---------- Companies / logo strip ---------- */
  .companies-wrap{position:relative;z-index:2;width:100%;grid-column:1 / -1;margin-top:8px;padding-top:32px;border-top:1px solid var(--border);}
  .companies-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin:0 0 18px;}
  .companies-track-mask{overflow:hidden;-webkit-mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);}
  .companies-track{display:flex;align-items:center;gap:44px;width:max-content;animation:marquee 32s linear infinite;}
  .companies-track-mask:hover .companies-track{animation-play-state:paused;}

  // ---------- crypto ----------
  async function sha256(str){
    var enc = new TextEncoder().encode(str);
    var buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }

  async function loadData(){

      if(res && res.value) return JSON.parse(res.value);
    }catch(e){}
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(DEFAULT_DATA), true); }catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  async function saveData(data){
    try{ var r = await window.storage.set(STORAGE_KEY, JSON.stringify(data), true); return !!r; }catch(e){ return false; }
  }
  async function loadPasswordHash(){
    try{
      var res = await window.storage.get(PASS_KEY, true);
      if(res && res.value) return res.value;
    }catch(e){}
    var h = await sha256(SALT+DEFAULT_PASSWORD);
    try{ await window.storage.set(PASS_KEY, h, true); }catch(e){}
    return h;
  }
  async function savePasswordHash(pw){
    var h = await sha256(SALT+pw);
    try{ return !!(await window.storage.set(PASS_KEY, h, true)); }catch(e){ return false; }
  }
  async function verifyPassword(input){
    var stored = await loadPasswordHash();
    var attempt = await sha256(SALT+input);
    return attempt === stored;
  }

  // ---------- architecture / dependency-graph diagram (hero centerpiece) ----------
  // Redesigned: curved connector paths instead of straight spokes, and the distracting
  // pulsing dot inside the "TK" core has been removed — the core now breathes via a
  // soft glow ring instead, which reads calmer and less "template-y".
  function systemDiagramSVG(){
    var cx=240, cy=240, coreR=34, satR=24;
    var nodes = [
      {x:240,y:66,  label:'ARCHITECTURE'},
      {x:406,y:186, label:'AI / ML'},
      {x:338,y:382, label:'DISTRIBUTED SYS'},
      {x:142,y:382, label:'BLOCKCHAIN'},
      {x:74, y:186, label:'FULL-STACK'}
    ];
    function curvePath(x1,y1,x2,y2){
      var mx=(x1+x2)/2, my=(y1+y2)/2;
      var dx=x2-x1, dy=y2-y1;
      var nx=-dy, ny=dx;
      var len=Math.sqrt(nx*nx+ny*ny)||1;
      var bend=18;
      var cxp=mx+(nx/len)*bend, cyp=my+(ny/len)*bend;
      return 'M'+x1+','+y1+' Q'+cxp+','+cyp+' '+x2+','+y2;
    }
    var edges = nodes.map(function(n){ return curvePath(cx,cy,n.x,n.y); }).concat([
      curvePath(406,186,338,382),
      curvePath(142,382,74,186),
      curvePath(338,382,142,382)
    ]);
    var svg = '<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
    edges.forEach(function(d,i){
      svg += '<path class="hd-edge" d="'+d+'"/>';
      if(!prefersReducedMotion){
        var dur = (3.6 + (i%5)*0.9).toFixed(1);
        var delay = (i*0.35).toFixed(2);
        svg += '<circle class="hd-packet" r="2.6"><animateMotion dur="'+dur+'s" begin="'+delay+'s" repeatCount="indefinite" path="'+d+'"/></circle>';
      }
    });
    svg += '<circle class="hd-core-glow" cx="'+cx+'" cy="'+cy+'" r="'+(coreR+9)+'"/>';
    svg += '<circle class="hd-node-ring core" cx="'+cx+'" cy="'+cy+'" r="'+coreR+'"/>';
    svg += '<text class="hd-monogram" x="'+cx+'" y="'+(cy+7)+'" text-anchor="middle">TK</text>';
    nodes.forEach(function(n){
      var ly = n.y > cy ? n.y + satR + 16 : n.y - satR - 10;
      svg += '<circle class="hd-node-ring" cx="'+n.x+'" cy="'+n.y+'" r="'+satR+'"/>';
      svg += '<circle class="hd-node-dot" cx="'+n.x+'" cy="'+n.y+'" r="3"/>';
      svg += '<text class="hd-label" x="'+n.x+'" y="'+ly+'" text-anchor="middle">'+esc(n.label)+'</text>';
    });
    svg += '</svg>';
    return svg;
  }

  function getByPath(obj, path){ var parts=path.split('.'); var cur=obj; for(var i=0;i<parts.length;i++){ cur=cur[parts[i]]; if(cur===undefined) return undefined; } return cur; }
  function setByPath(obj, path, value){ var parts=path.split('.'); var cur=obj; for(var i=0;i<parts.length-1;i++){ cur=cur[parts[i]]; } cur[parts[parts.length-1]]=value; }
  function removeAt(obj, path){ var parts=path.split('.'); var idx=parseInt(parts[parts.length-1],10); var arrPath=parts.slice(0,-1).join('.'); var arr=getByPath(obj, arrPath); arr.splice(idx,1); }

  function showLoginModal(){
    var u = UI[state.lang];
    if(Date.now() < state.lockUntil){ return; }
    var overlay = document.createElement('div'); overlay.className='overlay';
    overlay.innerHTML =
      '<div class="modal"><h3>'+esc(u.loginTitle)+'</h3><p class="hint">'+esc(u.loginHint)+'</p>'+
      '<div class="field"><label>'+esc(u.passwordLabel)+'</label><input type="password" id="loginPass"></div>'+
      '<p class="error-msg" id="loginError"></p>'+
      '<div class="modal-actions"><button class="btn" id="loginSubmit">'+esc(u.loginSubmit)+'</button><button class="btn ghost" id="loginCancel">'+esc(u.loginCancel)+'</button></div></div>';
    document.body.appendChild(overlay);
    var input = overlay.querySelector('#loginPass'); input.focus();
    var errEl = overlay.querySelector('#loginError');
    var submitBtn = overlay.querySelector('#loginSubmit');
    overlay.querySelector('#loginCancel').onclick = function(){ overlay.remove(); };
    overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
    function tickLock(){
      var remain = Math.ceil((state.lockUntil - Date.now())/1000);
      if(remain>0){
        submitBtn.disabled = true;
        errEl.style.display='block';
        errEl.textContent = u.loginLocked.replace('{s}', remain);
      } else {
        submitBtn.disabled = false;
        clearInterval(state._lockInterval);
      }
    }
    if(Date.now() < state.lockUntil){ tickLock(); state._lockInterval = setInterval(tickLock, 1000); }
    function submit(){
      if(Date.now() < state.lockUntil) return;
      verifyPassword(input.value).then(function(ok){
        if(ok){
          state.isAdmin = true; state.loginAttempts = 0;
          overlay.remove(); render();
        } else {
          state.loginAttempts++;
          if(state.loginAttempts >= MAX_ATTEMPTS){
            state.lockUntil = Date.now() + LOCK_MS;
            state.loginAttempts = 0;
            tickLock();
            state._lockInterval = setInterval(tickLock, 1000);
          } else {
            errEl.style.display='block';
            errEl.textContent = u.loginError;
          }
        }
      });
    }
    submitBtn.onclick = submit;
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
  }

  // ---------- observers ----------
  function initScrollSpy(){
    if(state._spyObserver) state._spyObserver.disconnect();
    var sections = appEl.querySelectorAll('main section[id]');
    var navLinks = appEl.querySelectorAll('.side-nav a');
    if(!sections.length || !navLinks.length) return;
    var map = {};
    navLinks.forEach(function(a){ map[a.getAttribute('href').slice(1)] = a; });
    var observer = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var link = map[entry.target.id];
        if(!link) return;
        if(entry.isIntersecting){ navLinks.forEach(function(l){ l.classList.remove('active'); }); link.classList.add('active'); }
      });
    }, { rootMargin:'-15% 0px -70% 0px', threshold:0 });
    sections.forEach(function(s){ observer.observe(s); });
    state._spyObserver = observer;
  }
  function initReveal(){
    if(state._revealObserver) state._revealObserver.disconnect();
    var els = appEl.querySelectorAll('.reveal');
    if(!els.length) return;
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target);} });
    }, {threshold:.12});
    els.forEach(function(el){ obs.observe(el); });
    state._revealObserver = obs;
  }

  // ---------- scroll-driven background scenes (soft glow only — grid lines removed) ----------
  var SCENE_IDS = ['summary','education','experience','projects','achievements','certifications','skills'];
  var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sceneTicking = false;

  function updateScenes(){
    sceneTicking = false;
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var vCenter = vh / 2;
    SCENE_IDS.forEach(function(id){
      var sectionEl = document.getElementById(id);
      var sceneEl = document.getElementById('scene-'+id);
      if(!sceneEl) return;
      if(!sectionEl){ sceneEl.style.opacity = 0; return; }
      var rect = sectionEl.getBoundingClientRect();
      var center = rect.top + rect.height / 2;
      var dist = Math.abs(center - vCenter);
      var focus = Math.max(0, 1 - dist / vh);
      focus = Math.pow(focus, 1.35);
      sceneEl.style.opacity = focus.toFixed(3);
      if(!prefersReducedMotion){
        var total = rect.height + vh;
        var traveled = vh - rect.top;
        var progress = Math.min(1, Math.max(0, traveled / total));
        sceneEl.style.setProperty('--pos', (18 + progress * 62).toFixed(1) + '%');
      }
    });
    if(!prefersReducedMotion){
      var heroEl = document.getElementById('hero');
      if(heroEl){
        var heroH = heroEl.offsetHeight || vh;
        var p = Math.min(1, Math.max(0, window.scrollY / (heroH * 0.75)));
        heroEl.style.opacity = (1 - p).toFixed(3);
        heroEl.style.transform = 'scale('+(1 - p*0.04).toFixed(3)+')';
        heroEl.style.pointerEvents = p > 0.6 ? 'none' : '';
      }
    }
  }

  function onSceneScroll(){
    if(!sceneTicking){ requestAnimationFrame(updateScenes); sceneTicking = true; }
  }

  function initSceneMotion(){
    if(prefersReducedMotion){
      // Static: show only the first scene, no motion, respecting the user's preference.
      SCENE_IDS.forEach(function(id, i){
        var el = document.getElementById('scene-'+id);
        if(el) el.style.opacity = (i===0) ? 1 : 0;
      });
      return;
    }
    window.addEventListener('scroll', onSceneScroll, { passive:true });
    window.addEventListener('resize', onSceneScroll);
    updateScenes();
  }

  // ---------- hero diagram parallax tilt (desktop, fine pointer, motion allowed) ----------
  function initHeroParallax(){
    var fine = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
    if(!fine || prefersReducedMotion) return;
    document.addEventListener('mousemove', function(e){
      var hero = document.getElementById('hero');
      var wrap = document.getElementById('heroDiagramWrap');
      if(!hero || !wrap) return;
      var r = hero.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      wrap.style.transform = 'rotateY('+(px*10).toFixed(2)+'deg) rotateX('+(py*-10).toFixed(2)+'deg)';
    }, {passive:true});
  }

      document.body.classList.remove('mode-edit');
      var c = d.content[state.lang];
      html = renderTopControls(u) + renderHero(u,c,state.lang) + '<div class="layout">'+renderSidebar(u,c,state.lang)+renderMain(u,c,state.lang)+'</div>';
      appEl.innerHTML = html;
      initScrollSpy();
      initReveal();
      onSceneScroll();
    }
    wire();
  }

  function wire(){
    var d = state.data;

    var btnOpenLogin = document.getElementById('btnOpenLogin'); if(btnOpenLogin) btnOpenLogin.onclick = showLoginModal;
    var btnEnterEdit = document.getElementById('btnEnterEdit'); if(btnEnterEdit) btnEnterEdit.onclick = function(){ state.mode='edit'; state.editLang=state.lang; state.saveStatus=''; render(); };
    var btnLogoutBar = document.getElementById('btnLogoutBar'); if(btnLogoutBar) btnLogoutBar.onclick = function(){ state.isAdmin=false; state.mode='view'; render(); };
    var btnLogout = document.getElementById('btnLogout'); if(btnLogout) btnLogout.onclick = function(){ state.isAdmin=false; state.mode='view'; render(); };
    var btnCancelEdit = document.getElementById('btnCancelEdit'); if(btnCancelEdit) btnCancelEdit.onclick = function(){ state.mode='view'; render(); };
    var btnCancelEdit2 = document.getElementById('btnCancelEdit2'); if(btnCancelEdit2) btnCancelEdit2.onclick = function(){ state.mode='view'; render(); };
    var btnPassword = document.getElementById('btnPassword'); if(btnPassword) btnPassword.onclick = showPasswordModal;

    var copyCards = appEl.querySelectorAll('[data-copy]');
    copyCards.forEach(function(el){
      el.addEventListener('click', function(){
        var val = el.getAttribute('data-copy');
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(val).catch(function(){});
        }
        var toast = el.querySelector('.copy-toast');
        if(toast){
          toast.classList.add('show');
          setTimeout(function(){ toast.classList.remove('show'); }, 1200);
        }
      });
    });

    var langBtns = appEl.querySelectorAll('.lang-btn');
    langBtns.forEach(function(btn){ btn.onclick = function(){ state.lang = btn.getAttribute('data-lang'); render(); }; });

    var btnThemeToggle = document.getElementById('btnThemeToggle');
    if(btnThemeToggle) btnThemeToggle.onclick = function(){
      var next = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      saveThemePref(next);
      btnThemeToggle.textContent = next === 'dark' ? '☀' : '☾';
    };

    var editLangTabs = appEl.querySelectorAll('.lang-tab');
    editLangTabs.forEach(function(btn){ btn.onclick = function(){ state.editLang = btn.getAttribute('data-editlang'); render(); }; });

    var editable = appEl.querySelectorAll('[data-path]');
    editable.forEach(function(el){
      el.addEventListener('input', function(){
        var path = el.getAttribute('data-path');
        var val = el.value;
        if(path.endsWith('bullets')){ setByPath(d, path, val.split('\n').filter(function(l){return l.trim().length>0;})); }
        else { setByPath(d, path, val); }
      });
    });

    var addButtons = appEl.querySelectorAll('[data-add]');
    addButtons.forEach(function(btn){
      btn.onclick = function(){
        var path = btn.getAttribute('data-add');
        var parts = path.split('.');
        var lang = parts[1];
        var key = parts[parts.length-1];
        var arr = getByPath(d, path);
        if(!arr){ arr=[]; setByPath(d, path, arr); }
        arr.push(emptyItem(lang, key));
        render();
      };
    });

    var removeButtons = appEl.querySelectorAll('[data-remove]');
    removeButtons.forEach(function(btn){
      btn.onclick = function(){ removeAt(d, btn.getAttribute('data-remove')); render(); };
    });

    var btnSave = document.getElementById('btnSave');
    if(btnSave) btnSave.onclick = function(){
      var u = UI[state.lang];
      btnSave.disabled = true; btnSave.textContent = u.saving;
      saveData(d).then(function(ok){
        state.saveStatus = ok ? (u.saved+' ✓') : u.saveFailed;
        state.mode = 'view';
        render();
      });
    };
  }

  // ---------- populate randomized parts of the living background (particles) ----------
  function buildLiveBackground(){
    var particlesEl = document.getElementById('bglParticles');
    if(particlesEl && !prefersReducedMotion){
      var pCount = window.innerWidth < 640 ? 16 : 30;
      var particles = '';
      for(var i=0;i<pCount;i++){
        var left = (Math.random()*100).toFixed(1);
        var top = (Math.random()*100).toFixed(1); // used as the resting position when static (night stars)
        var size = (2 + Math.random()*3).toFixed(1);
        var dur = (14 + Math.random()*18).toFixed(1);
        var delay = (-1*Math.random()*30).toFixed(1);
        particles += '<span class="bgl-particle" style="left:'+left+'%;top:'+top+'%;width:'+size+'px;height:'+size+'px;animation-duration:'+dur+'s, '+(4+Math.random()*4).toFixed(1)+'s;animation-delay:'+delay+'s, '+(Math.random()*4).toFixed(1)+'s;"></span>';
      }
      particlesEl.innerHTML = particles;
    }
  }

  // ---------- realistic falling stars (night only) ----------
  // Each meteor gets its own random angle, length, speed and starting point — like real
  // shooting stars, not a single repeating animation. The bright head streaks in a dead-straight
  // line and the tail is rotated to exactly match that line, so nothing looks canned or
  // "painted on a ceiling". Timing between meteors is irregular, and about a third of the
  // time nothing spawns at all (real meteor showers are bursty and unpredictable, not metronomic).
  function spawnFallingStar(){
    var host = document.getElementById('bglFallingStars');
    if(!host) return;
    if(document.documentElement.getAttribute('data-theme') !== 'dark'){ scheduleFallingStar(); return; }
    if(prefersReducedMotion) return;

    // Skip some cycles entirely for irregular, natural pacing.
    if(Math.random() < 0.35){ scheduleFallingStar(); return; }

    var star = document.createElement('span');
    star.className = 'bgl-falling-star';

    var angle = 16 + Math.random()*42;              // steepness from horizontal, degrees
    var dir = Math.random() < 0.5 ? 1 : -1;          // travels left-to-right or right-to-left
    var dist = 130 + Math.random()*230;              // total path length in px
    var rad = angle * Math.PI/180;
    var dx = dir * dist * Math.cos(rad);
    var dy = dist * Math.sin(rad);                   // always downward, like real meteors
    var dur = 500 + Math.random()*550;               // real streaks cross the sky fast
    var headSize = (1.2 + Math.random()*1.5).toFixed(2);
    var trailLen = Math.max(40, Math.round(dist*0.4));

    var startLeft = (6 + Math.random()*78).toFixed(1);
    var startTop = (Math.random()*28).toFixed(1);

    // Trail points backward along the exact line of travel — this is what keeps it looking real.
    var travelAngleDeg = Math.atan2(dy, dx) * 180/Math.PI;
    var trailAngleDeg = travelAngleDeg + 180;

    star.style.left = startLeft+'%';
    star.style.top = startTop+'%';
    star.style.width = headSize+'px';
    star.style.height = headSize+'px';
    star.style.setProperty('--trail-len', trailLen+'px');
    star.style.setProperty('--trail-angle', trailAngleDeg+'deg');
    host.appendChild(star);

    var anim = star.animate([
      { opacity:0,  transform:'translate(0px,0px) scale(.5)' },
      { opacity:1,  transform:'translate('+(dx*0.05).toFixed(1)+'px,'+(dy*0.05).toFixed(1)+'px) scale(1)', offset:0.06 },
      { opacity:1,  transform:'translate('+(dx*0.7).toFixed(1)+'px,'+(dy*0.7).toFixed(1)+'px) scale(.92)', offset:0.72 },
      { opacity:0,  transform:'translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) scale(.6)' }
    ], { duration: dur, easing:'cubic-bezier(.11,.4,.2,1)' });

    var cleanup = function(){ star.remove(); };
    anim.onfinish = cleanup;
    anim.oncancel = cleanup;

    scheduleFallingStar();
  }
  function scheduleFallingStar(){
    if(state._fallingStarTimer) clearTimeout(state._fallingStarTimer);
    var next = 2600 + Math.random()*6400; // irregular gap between 2.6s and 9s
    state._fallingStarTimer = setTimeout(spawnFallingStar, next);
  }
  function startFallingStarLoop(){
    scheduleFallingStar();
  }

  // ---------- boot ----------
  state.lang = detectLang();
  state.editLang = state.lang;
  buildLiveBackground();
  startFallingStarLoop();

  loadThemePref().then(function(pref){
    applyTheme(pref || detectDefaultTheme());
  }).catch(function(){
    applyTheme(detectDefaultTheme());
  }).then(function(){
    return loadData();
  }).then(function(data){
    state.data = data;
    loadingEl.style.display='none';
    appEl.style.display='block';
    render();
    initSceneMotion();
    initHeroParallax();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.body.classList.add('theme-ready'); }); });
  }).catch(function(){
    state.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
    loadingEl.style.display='none';
    appEl.style.display='block';
    render();
    initSceneMotion();
    initHeroParallax();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.body.classList.add('theme-ready'); }); });
  });

})();
</script>
